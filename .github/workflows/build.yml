name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
    pull_request: ~
    release:
        types: [ created ]
    workflow_dispatch: ~

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "PHP ${{ matrix.php }}, Sylius ${{ matrix.sylius }}"

        strategy:
            fail-fast: false
            matrix:
                php: [ "8.2", "8.3", "8.4" ]
                sylius: [ "~2.2.0" ]

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    coverage: none

            -
                name: Restrict Sylius version
                run: composer require "sylius/sylius:${{ matrix.sylius }}" --no-update --no-scripts

            -
                name: Install dependencies
                run: composer update --no-interaction --no-progress --prefer-dist

            -
                name: Check coding standard
                run: composer ecs

            -
                name: Run static analysis
                run: composer phpstan

            -
                name: Run unit tests
                run: composer phpunit
