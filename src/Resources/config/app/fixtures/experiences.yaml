                                    fr_FR:
                                        name: 'Truffe et Barolo dans les Langhe'
                                        short_description: 'À la chasse à la truffe blanche avec le trifolau, puis deux caves historiques de Barolo.'
                                        description: "À l'aube, direction les bois avec le trifolau et son chien ; au retour, la récolte finit sur les tajarin. L'après-midi se passe dans les caves de Barolo pour une verticale de millésimes historiques."
                                        meta_keywords: 'expérience langhe, chasse à la truffe blanche, dégustation barolo, trifolau, week-end piémont'
                                        meta_description: "Dans les Langhe avec le trifolau : chasse à la truffe blanche à l'aube, tajarin au déjeuner et verticale de Barolo dans deux caves. Dès 260 €."
