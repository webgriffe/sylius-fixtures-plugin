                                    - { path: '@WebgriffeSyliusFixturesPlugin/Resources/fixtures/images/esperienze/degustazione_1.webp' }
                                translations:
                                    it_IT:
                                        name: 'Full immersion nel Chianti Classico'
                                        short_description: 'Tre cantine del Gallo Nero, un pranzo in fattoria e la vendemmia vista da dentro.'
                                        description: 'Si parte da Greve in Chianti per attraversare i vigneti storici del Chianti Classico. Due giornate tra botti, oliveti e cucina toscana, con degustazione verticale di Riserva e Gran Selezione insieme al produttore.'
                                        meta_keywords: 'esperienza chianti classico, degustazione vino toscana, weekend enogastronomico, greve in chianti, visita cantine'
                                        meta_description: 'Due giorni nel Chianti Classico: tre cantine del Gallo Nero, pranzo in fattoria e degustazione verticale di Riserva con il produttore. Da 190 €.'
                                    en_US:
                                        name: 'Full immersion in Chianti Classico'
                                        short_description: 'Three Gallo Nero wineries, lunch at the farm and the harvest seen from the inside.'
                                        description: 'Starting from Greve in Chianti, the tour crosses the historic vineyards of Chianti Classico. Two days among casks, olive groves and Tuscan cooking, with a vertical tasting of Riserva and Gran Selezione alongside the producer.'
                                        meta_keywords: 'chianti classico experience, tuscany wine tasting, food and wine weekend, greve in chianti, winery tour'
                                        meta_description: 'Two days in Chianti Classico: three Gallo Nero wineries, lunch at the farm and a vertical tasting of Riserva with the producer. From €190.'
                                    fr_FR:
                                        name: 'Immersion dans le Chianti Classico'
                                        short_description: "Trois domaines du Gallo Nero, un déjeuner à la ferme et les vendanges vues de l'intérieur."
                                        description: 'Le départ se fait de Greve in Chianti pour traverser les vignobles historiques du Chianti Classico. Deux journées entre foudres, oliveraies et cuisine toscane, avec une dégustation verticale de Riserva et Gran Selezione en compagnie du vigneron.'
                                        meta_keywords: 'expérience chianti classico, dégustation toscane, week-end œnogastronomique, greve in chianti, visite de domaines'
                                        meta_description: 'Deux jours dans le Chianti Classico : trois domaines du Gallo Nero, déjeuner à la ferme et dégustation verticale de Riserva. À partir de 190 €.'

