sylius_fixtures:
    suites:
        webgriffe:
            fixtures:
                product_review:
                    options:
                        custom:
                            -   product: 'chianti_docg_ruffino'
                                rating: 5
                                title: 'Il rosso di casa'
                                comment: 'Ne ordino sei bottiglie alla volta da un anno. Sulla pizza del sabato non sbaglia mai e il prezzo resta onesto.'
                                author: 'cliente@webgriffe.com'
                                status: 'accepted'

                            -   product: 'chianti_docg_ruffino'
                                rating: 4
                                title: 'Buono, ma aspettatelo'
                                comment: "Appena stappato è un po' chiuso. Mezz'ora nel decanter e cambia completamente, tira fuori la ciliegia."
                                author: 'luca.bianchi@example.com'
                                status: 'accepted'

                            -   product: 'montepulciano_dabruzzo_zaccagnini'
                                rating: 4
                                title: 'Rapporto qualità prezzo ottimo'
                                comment: 'Sotto i dieci euro è difficile trovare di meglio. Morbido, senza spigoli, piace anche a chi non beve spesso rosso.'
                                author: 'giulia.ferrari@example.com'
                                status: 'accepted'

                            -   product: 'valpolicella_classico_bertani'
                                rating: 5
                                title: 'Fresco e beverino'
                                comment: 'Servito a 15 gradi come consigliato nella scheda: perfetto. Bottiglia finita in una sera fra quattro persone.'
                                author: 'marco.romano@example.com'
                                status: 'accepted'

                            -   product: 'barbera_dasti_michele_chiarlo'
                                rating: 4
                                title: 'Ottimo sugli agnolotti'
                                comment: 'Acidità giusta per i piatti di carne piemontesi. Il legno si sente ma non copre il frutto.'
                                author: 'alessandro.conti@example.com'
                                status: 'accepted'

                            -   product: 'nero_davola_planeta'
                                rating: 5
                                title: 'Sicilia in bottiglia'
                                comment: 'Preso per una grigliata, promosso a pieni voti. Caldo e speziato, tannino morbido.'
                                author: 'davide.barbieri@example.com'
                                status: 'accepted'

                            -   product: 'chianti_classico_riserva_ducale'
                                rating: 5
                                title: 'Una Riserva che non delude'
                                comment: "Regalata a mio padre che se ne intende. Mi ha telefonato il giorno dopo per chiedermi dove l'avevo comprata."
                                author: 'francesca.greco@example.com'
                                status: 'accepted'

                            -   product: 'primitivo_sessantanni_san_marzano'
                                rating: 4
                                title: 'Importante, forse troppo'
                                comment: 'Vino di grande struttura, ma quattordici e mezzo si sentono tutti. Va abbinato a piatti robusti.'
                                author: 'sara.moretti@example.com'
                                status: 'accepted'

                            -   product: 'brunello_montalcino_col_dorcia'
                                rating: 5
                                title: 'Vale ogni euro'
                                comment: 'Aperto per un anniversario. Ancora giovanissimo, ne ho comprata una seconda da dimenticare in cantina.'
                                author: 'valentina.rizzo@example.com'
                                status: 'accepted'

                            -   product: 'barolo_pio_cesare'
                                rating: 5
                                title: 'Il Barolo come dovrebbe essere'
                                comment: 'Austero, tannico, lunghissimo. Con il brasato è stata una serata da ricordare.'
                                author: 'alessandro.conti@example.com'
                                status: 'accepted'

                            -   product: 'amarone_valpolicella_allegrini'
                                rating: 4
                                title: 'Potente, da meditazione'
                                comment: 'Più che a tavola lo berrei da solo dopo cena. Il prezzo scontato lo rende interessante.'
                                author: 'cliente@webgriffe.com'
                                status: 'accepted'

                            -   product: 'tignanello_antinori'
                                rating: 5
                                title: 'Un classico che non tradisce'
                                comment: 'Arrivato imballato benissimo in due giorni. Il vino non ha bisogno di presentazioni.'
                                author: 'osteria.delborgo@example.com'
                                status: 'accepted'

                            -   product: 'verdicchio_villa_bianchi_umani_ronchi'
                                rating: 4
                                title: 'Perfetto con il pesce'
                                comment: "Sapido, con quella nota di mandorla in fondo. Lo tengo sempre in frigo d'estate."
                                author: 'chiara.esposito@example.com'
                                status: 'accepted'

                            -   product: 'vermentino_la_cala_sella_mosca'
                                rating: 5
                                title: 'Profuma di mare'
                                comment: 'Bevuto con spaghetti alle vongole, abbinamento da manuale. Ottimo anche come aperitivo.'
                                author: 'sara.moretti@example.com'
                                status: 'accepted'

                            -   product: 'pinot_grigio_santa_margherita'
                                rating: 3
                                title: 'Corretto, niente di più'
                                comment: 'È il pinot grigio che ti aspetti: pulito e facile. Per il prezzo mi aspettavo un pizzico di carattere in più.'
                                author: 'davide.barbieri@example.com'
                                status: 'accepted'

                            -   product: 'gavi_docg_la_scolca'
                                rating: 5
                                title: 'Il mio bianco preferito'
                                comment: 'Minerale e teso, non stanca mai. Con il promozionale in corso ne ho prese tre.'
                                author: 'giulia.ferrari@example.com'
                                status: 'accepted'

                            -   product: 'prosecco_doc_jeio_bisol'
                                rating: 4
                                title: 'Aperitivo garantito'
                                comment: 'Bollicina fine e prezzo giusto. Per una cena fra amici ne bastano due bottiglie.'
                                author: 'marco.romano@example.com'
                                status: 'accepted'

                            -   product: 'franciacorta_cuvee_prestige_ca_del_bosco'
                                rating: 5
                                title: 'Metodo classico serio'
                                comment: 'Crosta di pane e agrumi, perlage finissimo. Regalato a Natale, figura sempre bene.'
                                author: 'enoteca.centrale@example.com'
                                status: 'accepted'

                            -   product: 'dom_perignon_vintage'
                                rating: 5
                                title: 'Per le occasioni vere'
                                comment: 'Comprato per il matrimonio di mia sorella. Confezione impeccabile e consegna puntuale.'
                                author: 'valentina.rizzo@example.com'
                                status: 'accepted'

                            -   product: 'moscato_dasti_araldica'
                                rating: 4
                                title: 'Dolce ma non stucchevole'
                                comment: "Con il panettone è d'obbligo. Cinque gradi e mezzo, lo bevono tutti volentieri."
                                author: 'francesca.greco@example.com'
                                status: 'accepted'

                            -   product: 'ben_rye_donnafugata'
                                rating: 5
                                title: 'Un passito straordinario'
                                comment: 'Albicocca secca e una sapidità che pulisce la bocca. Mezza bottiglia basta per sei persone.'
                                author: 'luca.bianchi@example.com'
                                status: 'accepted'

                            -   product: 'calici_bordeaux_riedel_vinum'
                                rating: 5
                                title: 'Cambiano il vino davvero'
                                comment: 'Pensavo fossero discorsi da sommelier, poi ho provato lo stesso Barolo in due bicchieri diversi. Ricredutomi.'
                                author: 'alessandro.conti@example.com'
                                status: 'accepted'

                            -   product: 'calici_degustazione_iso'
                                rating: 4
                                title: 'Quelli del corso'
                                comment: 'Sono esattamente i bicchieri usati al corso da sommelier. Confezione da sei ben imballata.'
                                author: 'chiara.esposito@example.com'
                                status: 'accepted'

                            -   product: 'flute_spiegelau_style'
                                rating: 3
                                title: 'Belli ma delicati'
                                comment: 'Molto eleganti, però uno si è rotto in lavastoviglie al secondo lavaggio. Consiglio a mano.'
                                author: 'sara.moretti@example.com'
                                status: 'accepted'

                            -   product: 'esperienza_chianti'
                                rating: 5
                                title: 'Due giorni indimenticabili'
                                comment: 'Guida preparatissima e cantine scelte bene. Il pranzo in fattoria valeva da solo il viaggio.'
                                author: 'cliente@webgriffe.com'
                                status: 'accepted'

                            -   product: 'esperienza_appennino'
                                rating: 5
                                title: "Il caseificio all'alba"
                                comment: "Vedere la caldaia alle sei del mattino è un'esperienza. Ottima anche la parte sui vini della pedecollina."
                                author: 'davide.barbieri@example.com'
                                status: 'accepted'

                            -   product: 'esperienza_langhe'
                                rating: 4
                                title: 'Tartufo e Barolo, cosa volere di più'
                                comment: 'Cerca del tartufo emozionante, unico neo la partenza molto presto. Organizzazione perfetta.'
                                author: 'enoteca.centrale@example.com'
                                status: 'accepted'

                            -   product: 'barolo_monfortino_giacomo_conterno'
                                rating: 5
                                title: 'Bottiglia da collezione'
                                comment: "Arrivata in cantinetta e mai aperta. La tengo per i settant'anni di mio padre."
                                author: 'osteria.delborgo@example.com'
                                status: 'new'

                            -   product: 'masseto_toscana'
                                rating: 4
                                title: 'Costosissimo ma unico'
                                comment: 'Bevuto una volta in vita mia, grazie a una cena speciale. Vellutato come pochi.'
                                author: 'valentina.rizzo@example.com'
                                status: 'new'

                            -   product: 'moet_chandon_brut_imperial'
                                rating: 2
                                title: "Non all'altezza del prezzo"
                                comment: "Sarà l'abitudine, ma con la stessa cifra preferisco un Franciacorta italiano."
                                author: 'marco.romano@example.com'
                                status: 'rejected'

                            -   product: 'barolo_pio_cesare'
                                rating: 5
                                title: 'Worth every year of the wait'
                                comment: 'Bought after a tasting in Alba. Austere now, but the perfume of dried rose is already unmistakable. Cellaring the other two bottles.'
                                author: 'emma.clarke@example.com'
                                status: 'accepted'

                            -   product: 'calici_bordeaux_riedel_vinum'
                                rating: 5
                                title: 'They really do change the wine'
                                comment: 'Sceptical at first, then we compared the same Barolo in these and in ordinary glasses. No contest. Packed very well for the trip to London.'
                                author: 'emma.clarke@example.com'
                                status: 'accepted'

                            -   product: 'prosecco_doc_jeio_bisol'
                                rating: 4
                                title: 'Our house sparkling'
                                comment: 'Ordered a case for a summer party. Fresh, not too sweet, and it arrived in Dublin in four days as promised.'
                                author: 'michael.byrne@example.com'
                                status: 'accepted'

                            -   product: 'esperienza_valpolicella'
                                rating: 5
                                title: 'The drying lofts are something else'
                                comment: 'Walking between the racks where the grapes rest for months is worth the trip on its own. The cellar master answered every question, in English.'
                                author: 'michael.byrne@example.com'
                                status: 'accepted'

                            -   product: 'gavi_docg_la_scolca'
                                rating: 5
                                title: 'Le blanc que je commande en caisse'
                                comment: 'Minéral, tendu, parfait sur les fruits de mer. Livré à Lyon en cinq jours, emballage impeccable.'
                                author: 'sophie.laurent@example.com'
                                status: 'accepted'

                            -   product: 'ben_rye_donnafugata'
                                rating: 5
                                title: 'Un liquoreux inoubliable'
                                comment: 'Abricot sec et une salinité qui nettoie la bouche. La demi-bouteille suffit pour six personnes en fin de repas.'
                                author: 'sophie.laurent@example.com'
                                status: 'accepted'

                            -   product: 'amarone_valpolicella_allegrini'
                                rating: 4
                                title: 'Puissant, à ouvrir longtemps avant'
                                comment: "Servi sur un plat de gibier, il a écrasé la sauce. Ouvrez-le deux heures avant, il s'assouplit beaucoup."
                                author: 'lucas.moreau@example.com'
                                status: 'accepted'

                            -   product: 'calici_degustazione_iso'
                                rating: 4
                                title: 'Les verres de nos dégustations'
                                comment: "Nous les utilisons au restaurant pour les dégustations à l'aveugle. Robustes et conformes à la norme."
                                author: 'lucas.moreau@example.com'
                                status: 'accepted'

