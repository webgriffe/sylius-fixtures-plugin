                                        name: 'Tartufo e Barolo nelle Langhe'
                                        short_description: 'A caccia di tartufo bianco con il trifolau, poi due cantine storiche di Barolo.'
                                        description: "All'alba si va nei boschi con il trifolau e il suo cane, al ritorno il bottino finisce sui tajarin. Il pomeriggio si scende nelle cantine di Barolo per una verticale di annate storiche."
                                        meta_keywords: 'esperienza langhe, cerca del tartufo bianco, degustazione barolo, trifolau, weekend piemonte'
