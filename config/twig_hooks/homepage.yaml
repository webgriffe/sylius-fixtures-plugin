sylius_twig_hooks:
    hooks:
        'sylius_shop.homepage.index':
            # the clothing banner of Sylius, replaced by a vineyard fitting the demo wine shop
            banner:
                template: '@WebgriffeSyliusFixturesPlugin/shop/homepage/banner.html.twig'
                priority: 300
            # the clothing photos of the "new collection", replaced by the categories of the menu
            new_collection:
                template: '@WebgriffeSyliusFixturesPlugin/shop/homepage/categories.html.twig'
                priority: 100
