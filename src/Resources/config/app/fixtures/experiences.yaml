                                translations:
                                    it_IT:
                                        name: "Weekend sull'Appennino Tosco-Emiliano"
                                        short_description: 'Parmigiano Reggiano di montagna, Lambrusco e la Pietra di Bismantova.'
                                        description: 'Sveglia presto per la caldaia del caseificio, poi escursione sulla Pietra di Bismantova e pranzo in rifugio. Il pomeriggio è dedicato alle cantine della pedecollina reggiana, tra Lambrusco e Spergola.'
                                        meta_keywords: 'esperienza appennino tosco emiliano, parmigiano reggiano di montagna, lambrusco, pietra di bismantova, weekend emilia'
                                        meta_description: "Weekend sull'Appennino Tosco-Emiliano: caseificio all'alba, escursione alla Pietra di Bismantova e cantine della pedecollina reggiana. Da 140 €."
                                    en_US:
                                        name: 'A weekend in the Tuscan-Emilian Apennines'
                                        short_description: 'Mountain Parmigiano Reggiano, Lambrusco and the Pietra di Bismantova.'
                                        description: 'An early start at the cheese dairy, then a hike up the Pietra di Bismantova and lunch at a mountain hut. The afternoon goes to the cellars of the Reggio hills, between Lambrusco and Spergola.'
                                        meta_keywords: 'tuscan emilian apennines experience, mountain parmigiano reggiano, lambrusco, pietra di bismantova, emilia weekend'
                                        meta_description: 'A weekend in the Tuscan-Emilian Apennines: the dairy at dawn, a hike up the Pietra di Bismantova and the cellars of the Reggio hills. From €140.'
                                    fr_FR:
                                        name: 'Un week-end dans les Apennins tosco-émiliens'
                                        short_description: 'Parmigiano Reggiano de montagne, lambrusco et la Pietra di Bismantova.'
                                        description: "Lever tôt pour la chaudière de la fromagerie, puis randonnée sur la Pietra di Bismantova et déjeuner au refuge. L'après-midi est consacré aux caves des collines de Reggio, entre lambrusco et spergola."
                                        meta_keywords: 'expérience apennins tosco-émiliens, parmigiano reggiano de montagne, lambrusco, pietra di bismantova, week-end émilie'
                                        meta_description: "Week-end dans les Apennins tosco-émiliens : fromagerie à l'aube, randonnée à la Pietra di Bismantova et caves des collines de Reggio. Dès 140 €."

